name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Instalar dependências
        run: pip install -e ".[dev]"

      - name: Lint (ruff check)
        run: ruff check .

      - name: Formatação (ruff format --check)
        run: ruff format --check .

      - name: Testes (pytest + cobertura)
        run: pytest --cov

  frontend:
    name: Frontend (lint + tsc + vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Formatação (Prettier)
        run: npm run format:check

      - name: Build (tsc + vite)
        run: npm run build

      - name: Testes (Vitest)
        run: npm test

  contrato:
    name: Contrato da API (schema.d.ts atualizado)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar backend
        working-directory: backend
        run: pip install -e .

      - name: Gerar openapi.json a partir do app (sem subir servidor)
        working-directory: backend
        run: >-
          python -c 'import json, pathlib; from app.main import app;
          pathlib.Path("../frontend/openapi.json").write_text(json.dumps(app.openapi(),
          ensure_ascii=False), encoding="utf-8")'

      - name: Instalar frontend
        working-directory: frontend
        run: npm ci

      - name: Regenerar src/api/schema.d.ts
        working-directory: frontend
        run: npm run gen:api:file

      - name: Verificar se o schema versionado está atualizado
        run: |
          if ! git diff --exit-code -- frontend/src/api/schema.d.ts; then
            echo "::error file=frontend/src/api/schema.d.ts::Tipos da API desatualizados. Suba o backend e rode 'npm run gen:api' em frontend/."
            exit 1
          fi
